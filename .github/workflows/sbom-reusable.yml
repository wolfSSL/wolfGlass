name: wolfGlass SBOM (reusable)

# A reusable workflow for product repositories. A product calls it to build its
# SBOM with the vendored wolfGlass driver, validate the output, and prove that no
# absolute host path leaked into the document.
#
# Example caller in a product repo:
#
#   jobs:
#     sbom:
#       uses: wolfSSL/wolfGlass/.github/workflows/sbom-reusable.yml@v1
#       with:
#         name-prefix: wolfboot
#         build-command: make sbom
#         outputs: "*.cdx.json *.spdx.json"

on:
  workflow_call:
    inputs:
      name-prefix:
        description: Expected metadata.component.name prefix (the product name).
        required: true
        type: string
      build-command:
        description: Command that builds the product and generates the SBOM.
        required: true
        type: string
      outputs:
        description: Space-separated globs of the generated SBOM files.
        required: false
        default: "*.cdx.json *.spdx.json"
        type: string
      vendored-path:
        description: Where wolfGlass share/ is vendored in the product.
        required: false
        default: tools/sbom
        type: string
      wolfglass-ref:
        description: wolfGlass ref to check drift against (empty = skip drift).
        required: false
        default: ""
        type: string

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout product
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check vendored drift
        if: inputs.wolfglass-ref != ''
        run: |
          git clone --depth 1 --branch "${{ inputs.wolfglass-ref }}" \
            https://github.com/wolfSSL/wolfGlass _wolfglass
          python _wolfglass/tools/wolfglass-sync \
            --dest "$GITHUB_WORKSPACE" \
            --subdir "${{ inputs.vendored-path }}" \
            --check

      - name: Build SBOM
        run: ${{ inputs.build-command }}

      - name: Validate SBOM
        run: |
          python "${{ inputs.vendored-path }}/validate_sbom.py" \
            --name-prefix "${{ inputs.name-prefix }}" ${{ inputs.outputs }}

      - name: Assert no host path leak
        run: |
          # A published SBOM must not contain build-machine absolute paths.
          if grep -REn '"/(home|Users|root)/' ${{ inputs.outputs }}; then
            echo "ERROR: absolute host path found in SBOM (scrub failed)." >&2
            exit 1
          fi
          echo "OK: no host path leak."

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.name-prefix }}
          path: ${{ inputs.outputs }}
